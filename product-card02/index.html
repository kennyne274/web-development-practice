<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MYBEAN Product Card</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap"
        rel="stylesheet">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:"Roboto",sans-serif;
        }

        body{

            background:white;

            display:flex;
            justify-content:center;
            align-items:center;

            min-height:100vh;

        }

        .card{

            width:820px;

            border:1px solid #e6e6e6;

            display:flex;

            background:white;

            box-shadow:0 8px 20px rgba(0,0,0,.05);

        }

        .left{

            width:45%;

            border-right:1px solid #e6e6e6;

            display:flex;
            justify-content:center;
            align-items:center;

            padding:40px;
        }

        .left img{

            width:220px;
        }

        .right{

            width:55%;

            padding:45px;
        }

        .category{

            color:#888;

            font-size:14px;

            text-transform:uppercase;

            letter-spacing:2px;
        }

        h2{

            margin-top:8px;

            font-size:34px;

            font-weight:300;

            color:#333;
        }

        .price{

            margin:25px 0;

            font-size:42px;

            color:#6f4e37;

            font-weight:300;
        }

        .description{

            color:#777;

            line-height:1.8;

            margin-bottom:35px;
        }

        .buttons{

            display:flex;

            gap:15px;
        }

        .buttons a{

            text-decoration:none;

            border:1px solid #bbb;

            padding:14px 28px;

            color:#555;

            transition:.3s;
        }

        .buttons a:hover{

            background:#6f4e37;

            color:white;

            border-color:#6f4e37;
        }

        .top{

            position:absolute;

            margin-top:-25px;

            width:820px;

            display:flex;

            justify-content:space-between;

            color:#888;

            font-size:13px;
        }

        .top a{

            color:#777;

            text-decoration:none;
        }

        .top i{

            cursor:pointer;
        }

    </style>

</head>

<body>

<div>

<div class="top">

<a href="#">
<i class="fa-solid fa-chevron-left"></i>
BACK TO SHOP
</a>

<i class="fa-regular fa-heart"></i>

</div>

<div class="card">

<div class="left">

<img src="https://cdn.pixabay.com/photo/2012/04/14/15/14/coffee-34251_1280.png" alt="Coffee Bean">

</div>

<div class="right">

<p class="category">
Premium Single Origin
</p>

<h2>
ETHIOPIA<br>
GUJI NATURAL
</h2>

<div class="price">
₩24,000
</div>

<p class="description">

블루베리의 달콤한 향미와 은은한 플로럴 향이
조화를 이루는 스페셜티 커피입니다.
부드러운 단맛과 깔끔한 여운을 즐겨보세요.

</p>

<div class="buttons">

<a href="#">ADD TO CART</a>

<a href="#">DETAILS</a>

</div>

</div>

</div>

</div>

</body>

</html>
